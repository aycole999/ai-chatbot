name: ai-chatbot

networks:
  chatbot-net:
    driver: bridge
  ruoyi-net:
    external: true
    name: ${BACKEND_DOCKER_NETWORK:-legal_ruoyi-net}

services:
  ai-chatbot:
    build:
      context: ${APP_BUILD_CONTEXT:-../..}
      dockerfile: ${APP_DOCKERFILE:-script/docker/app/Dockerfile}
    image: ${AI_CHATBOT_IMAGE:-ai-chatbot:latest}
    container_name: ai-chatbot
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://nginx-web/prod-api}
    expose:
      - "3000"
    ports:
      - "${CHATBOT_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ping | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    networks:
      - chatbot-net
      - ruoyi-net
