name: ai-chatbot

networks:
  chatbot-net:
    driver: bridge
  ruoyi-net:
    external: true
    name: ${BACKEND_DOCKER_NETWORK:-legal_ruoyi-net}
  proxy-net:
    external: true
    name: ${PROXY_DOCKER_NETWORK:-proxy-net}

services:
  ai-chatbot:
    image: ${AI_CHATBOT_IMAGE:-ai-chatbot:latest}
    container_name: ai-chatbot
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://nginx-web/prod-api}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ping | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: always
    networks:
      - chatbot-net
      - ruoyi-net

  ai-chatbot-nginx:
    image: nginx:1.27-alpine
    container_name: ai-chatbot-nginx
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${AI_CHATBOT_HTTP_PORT:-182}:80"
    volumes:
      - ./ai-chatbot/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ai-chatbot/nginx/log:/var/log/nginx
    depends_on:
      ai-chatbot:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chatbot-net
      - ruoyi-net
      - proxy-net
